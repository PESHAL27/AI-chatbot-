<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="pml-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CFF45" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9CFF45" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="64" height="64" rx="15" fill="#050805"/>
  <rect width="62" height="62" x="1" y="1" rx="14" stroke="#1f3e20" stroke-width="1.5"/>

  <!-- Subtle ambient central glow -->
  <circle cx="32" cy="32" r="22" fill="url(#pml-glow)"/>

  <!-- Delicate connecting constellation lines -->
  <g stroke="#9CFF45" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="32" y1="12" x2="32" y2="52"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="18" y1="18" x2="46" y2="46"/>
    <line x1="18" y1="46" x2="46" y2="18"/>
  </g>

  <!-- Glow under nodes -->
  <g fill="#9CFF45" opacity="0.6" filter="url(#blur-glow)">
    <circle cx="32" cy="32" r="7"/>
    <circle cx="32" cy="12" r="5"/>
    <circle cx="32" cy="52" r="5"/>
    <circle cx="12" cy="32" r="5"/>
    <circle cx="52" cy="32" r="5"/>
    <circle cx="18" cy="18" r="4"/>
    <circle cx="46" cy="18" r="4"/>
    <circle cx="18" cy="46" r="4"/>
    <circle cx="46" cy="46" r="4"/>
  </g>

  <!-- Solid PML Nodes (#9CFF45) -->
  <!-- Center node -->
  <circle cx="32" cy="32" r="6.4" fill="#9CFF45"/>
  <!-- Cardinal nodes -->
  <circle cx="32" cy="12" r="4.4" fill="#9CFF45" opacity="0.95"/>
  <circle cx="32" cy="52" r="4.4" fill="#9CFF45" opacity="0.95"/>
  <circle cx="12" cy="32" r="4.4" fill="#9CFF45" opacity="0.95"/>
  <circle cx="52" cy="32" r="4.4" fill="#9CFF45" opacity="0.95"/>
  <!-- Diagonal nodes -->
  <circle cx="18" cy="18" r="3.6" fill="#9CFF45" opacity="0.85"/>
  <circle cx="46" cy="18" r="3.6" fill="#9CFF45" opacity="0.85"/>
  <circle cx="18" cy="46" r="3.6" fill="#9CFF45" opacity="0.85"/>
  <circle cx="46" cy="46" r="3.6" fill="#9CFF45" opacity="0.85"/>
</svg>